# 构建 Windows x64 便携版：
# - 手动运行 / 推送 ci/** 分支：只产出 Artifact。
# - 在网页发布 Release（任意标签名）：构建该标签，把 zip 与 sha256 上传到这个 Release。
# - 推送 v* 标签：构建并创建 Release；该标签已有 Release 时跳过（由 release 事件或下面的补传负责）。
# - 手动运行并填写 release_tag：构建该标签，上传到已存在的 Release（覆盖同名文件），用于补传或重传。
name: Build portable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：已存在的 Release 的标签名。填写后构建该标签并上传到这个 Release（覆盖同名文件）'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']
    branches: ['ci/**']   # CI experiments: build only, no release
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  # One run per tag at a time: a v* tag push and the release published for it queue instead of racing.
  group: build-${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  PY_VERSION: 3.14.8
  PY_DIR: lib\python-3.14.8-embed-amd64
  PY_SHA256: a93abe456ab01bd96d7a085b3cdb6566b3063f4241360d114142fbdb07f0a310
  # Must match TOOLS in scripts/portable_assets.py
  SCRCPY_NAME: scrcpy-win64-v5.0
  SCRCPY_URL: https://github.com/Genymobile/scrcpy/releases/download/v5.0/scrcpy-win64-v5.0.zip
  SCRCPY_SHA256: 44c10d9e82f20ea67227d14d37bf9fbe3603117c5736df3f514544a02ba20a73
  TERMINAL_NAME: terminal-1.25.2733.0
  TERMINAL_URL: https://github.com/microsoft/terminal/releases/download/v1.25.2733.0/Microsoft.WindowsTerminal_1.25.2733.0_x64.zip
  TERMINAL_SHA256: bf3ef2012f6c44d8340a4c58125acc9498d19b580f9890dc043cdf831852e796
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

defaults:
  run:
    shell: pwsh

jobs:
  # Decide what this run does: artifact only, upload into an existing release,
  # create a release (v* tag push), or skip (the tag already has a release).
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - name: Decide mode
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mode=artifact
          tag=
          input_tag="$(echo "${INPUT_TAG:-}" | xargs)"
          if [[ "$EVENT" == release ]]; then
            mode=upload
            tag="$EVENT_TAG"
          elif [[ "$EVENT" == workflow_dispatch && -n "$input_tag" ]]; then
            tag="$input_tag"
            if ! gh release view "$tag" > /dev/null; then
              echo "::error::No release for tag '$tag'. Create (publish) the release first, then run again with release_tag."
              exit 1
            fi
            mode=upload
          elif [[ "$EVENT" == push && "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::notice::Release '$tag' already exists; its release event (or a manual run with release_tag) uploads the files."
              mode=skip
            else
              mode=create
            fi
          fi
          ref=
          if [[ -n "$tag" ]]; then ref="refs/tags/$tag"; fi
          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$mode tag=${tag:-<none>} ref=${ref:-<event ref>}"

  build:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # Release builds check out the release tag itself (empty ref = the event's ref)
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      # Download/pip caches live outside the repo so the build never sees them
      - name: Resolve cache paths
        run: |
          "DL=$HOME\sysdroid-downloads" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$HOME\sysdroid-pip-cache" >> $env:GITHUB_ENV

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\sysdroid-downloads
            ~\sysdroid-pip-cache
          key: dl-py${{ env.PY_VERSION }}-${{ env.SCRCPY_NAME }}-${{ env.TERMINAL_NAME }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            dl-py${{ env.PY_VERSION }}-${{ env.SCRCPY_NAME }}-${{ env.TERMINAL_NAME }}-

      # Download once (or reuse cache) and always verify SHA-256
      - name: Download and verify archives
        run: |
          $ErrorActionPreference = 'Stop'
          $dl = $env:DL
          New-Item -ItemType Directory -Force $dl | Out-Null
          $items = @(
            @{ Url = "https://www.python.org/ftp/python/$env:PY_VERSION/python-$env:PY_VERSION-embed-amd64.zip"; Sha = $env:PY_SHA256 },
            @{ Url = $env:SCRCPY_URL; Sha = $env:SCRCPY_SHA256 },
            @{ Url = $env:TERMINAL_URL; Sha = $env:TERMINAL_SHA256 }
          )
          foreach ($i in $items) {
            $file = Join-Path $dl (Split-Path $i.Url -Leaf)
            if (-not (Test-Path $file) -or (Get-FileHash $file -Algorithm SHA256).Hash -ne $i.Sha) {
              Write-Host "Downloading $($i.Url)"
              Invoke-WebRequest $i.Url -OutFile $file
            }
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash
            if ($actual -ne $i.Sha) {
              Remove-Item $file -Force
              throw "SHA-256 mismatch for $($i.Url): expected $($i.Sha), got $actual"
            }
            Write-Host "OK $file"
          }
          # get-pip.py is not pinned; refresh it every run
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile (Join-Path $dl 'get-pip.py')

      # Same layout as DEPENDENCIES.md; no pip.ini, so pip uses default PyPI
      - name: Set up embedded Python
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive "$env:DL\python-$env:PY_VERSION-embed-amd64.zip" -DestinationPath $env:PY_DIR -Force
          $pth = @('python314.zip', '.', 'Lib\site-packages', '', '# Uncomment to run site.main() automatically', 'import site')
          Set-Content "$env:PY_DIR\python314._pth" $pth -Encoding ascii
          New-Item -ItemType Directory -Force "$env:PY_DIR\Lib\site-packages" | Out-Null
          & "$env:PY_DIR\python.exe" "$env:DL\get-pip.py" --no-warn-script-location
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:PY_DIR\python.exe" -m pip install --no-warn-script-location -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:PY_DIR\python.exe" --version
          & "$env:PY_DIR\python.exe" -m pip list

      # Archives have a top-level folder, so extract straight into tool\
      - name: Place tools
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force tool | Out-Null
          Expand-Archive "$env:DL\$env:SCRCPY_NAME.zip" -DestinationPath tool -Force
          Expand-Archive "$env:DL\Microsoft.WindowsTerminal_1.25.2733.0_x64.zip" -DestinationPath tool -Force
          foreach ($exe in "tool\$env:SCRCPY_NAME\scrcpy.exe", "tool\$env:SCRCPY_NAME\adb.exe", "tool\$env:TERMINAL_NAME\WindowsTerminal.exe") {
            if (-not (Test-Path $exe)) { throw "Missing $exe after extraction" }
          }

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & "$env:PY_DIR\python.exe" -s -m pytest tests -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The build script itself re-downloads/verifies tools and license sources.
      # NETRC lets requests authenticate to api.github.com only (avoids the 60/h anonymous limit).
      - name: Build portable package
        run: |
          $netrc = Join-Path $env:RUNNER_TEMP 'netrc'
          "machine api.github.com login x-access-token password $env:GH_TOKEN" | Set-Content $netrc -Encoding ascii
          $env:NETRC = $netrc
          # The runner's PATH includes third-party DLL folders (e.g. MySQL's libssl),
          # which PyInstaller would otherwise pick up. Keep only Windows system dirs.
          $sys = $env:SystemRoot
          $env:PATH = @((Join-Path $PWD $env:PY_DIR), "$sys\System32", "$sys", "$sys\System32\Wbem", "$sys\System32\WindowsPowerShell\v1.0") -join ';'
          # pwsh 7's PSModulePath breaks Get-AuthenticodeSignature in the Windows PowerShell 5.1
          # child the build uses to verify OS-signed DLLs (icu.dll, propsys.dll). Let 5.1 use its defaults.
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          try {
            & "$env:PY_DIR\python.exe" -s scripts\build_sysdroid.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $netrc -Force -ErrorAction SilentlyContinue
          }
        env:
          GH_TOKEN: ${{ github.token }}

      # Release builds: tag without a leading "v" (v0.2.0 -> 0.2.0); otherwise the built commit's short SHA
      - name: Name release files
        id: pkg
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = if ($env:RELEASE_TAG) { $env:RELEASE_TAG -replace '^v', '' } else { (git rev-parse --short=7 HEAD).Trim() }
          $ver = $ver -replace '[^0-9A-Za-z._-]', '-'
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = "SysDroid-win-x64-$ver.zip"
          Copy-Item dist\SysDroid-win-x64.zip "out\$zip"
          Copy-Item dist\SysDroid-win-x64.files.sha256 "out\SysDroid-win-x64-$ver.files.sha256"
          $hash = (Get-FileHash "out\$zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "out\$zip.sha256" -Encoding ascii
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysDroid-win-x64-${{ steps.pkg.outputs.version }}
          path: out/*
          if-no-files-found: error

      # On failure, keep the build stage (logs, failure.json) for diagnosis
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            build/sysdroid/**/*.json
            build/sysdroid/**/*.log
          if-no-files-found: ignore

      # Idempotent: re-running replaces same-named assets (--clobber); a v* push creates the
      # release only if none exists yet, otherwise it uploads into the existing one.
      - name: Upload to GitHub Release
        if: env.MODE == 'upload' || env.MODE == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @((Get-ChildItem out -File).FullName)
          gh release view $env:RELEASE_TAG 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          if ($env:MODE -eq 'create' -and -not $exists) {
            gh release create $env:RELEASE_TAG @files --verify-tag --generate-notes --title $env:RELEASE_TAG
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Creating release $env:RELEASE_TAG failed (it may have been created meanwhile); uploading instead."
          } elseif (-not $exists) {
            throw "Release $env:RELEASE_TAG not found"
          }
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Write-Host "Uploaded $($files.Count) files to release $env:RELEASE_TAG"
